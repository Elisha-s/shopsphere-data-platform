# Declarative Automation Bundle for the ShopSphere data platform.
# https://docs.databricks.com/dev-tools/bundles/index.html
#
# The workspace is not written here. Point the CLI at one with a profile:
#   databricks bundle deploy -t dev --profile <your-profile>
bundle:
  name: shopsphere_data_platform
  uuid: cb64147f-9f8a-41d3-913e-8e148c1375ba

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

variables:
  catalog:
    description: >-
      Unity Catalog catalog that holds the bronze, silver, gold and metadata
      schemas. Dev and prod are separated by using a different catalog each.
  eventhubs_namespace:
    description: Azure Event Hubs namespace (the part before .servicebus.windows.net).
    default: shopsphere-events
  adf_service_principal_id:
    description: >-
      Application (client) ID of the Azure Data Factory managed identity. It is
      granted permission to run the two jobs. Pass it at deploy time:
      --var adf_service_principal_id=<id>

targets:
  dev:
    # 'mode: development' prefixes job and pipeline names with '[dev <user>]'
    # and pauses schedules. It does not rename tables: isolation between
    # environments comes from the catalog below.
    mode: development
    default: true
    variables:
      catalog: adb_shopsphere_dev

  prod:
    mode: production
    workspace:
      # One fixed location, so there is only ever a single production copy.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: adb_shopsphere_prod
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE

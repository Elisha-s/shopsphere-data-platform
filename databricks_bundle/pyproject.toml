[project]
name = "shopsphere_data_platform"
version = "0.0.1"
authors = [{ name = "elisha.singh@outlook.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[project.scripts]
cdf-merge = "shopsphere_data_platform_etl.jobs.cdf_merge:main"
validate-outputs = "shopsphere_data_platform_etl.jobs.validate_outputs:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopsphere_data_platform_etl"]

[tool.ruff]
line-length = 120

resources:
  jobs:

    shopsphere_cdf_merge:
      name: shopsphere_cdf_merge

      permissions:
        - service_principal_name: fb2921f3-27f3-4d45-855d-6f2feacb5896
          level: CAN_MANAGE_RUN

      tasks:
        - task_key: merge_current_orders
          python_wheel_task:
            package_name: shopsphere_data_platform
            entry_point: cdf-merge

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

# A sample job for shopsphere_data_platform.

resources:
  jobs:
    sample_job:
      name: sample_job

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      permissions:
        - service_principal_name: fb2921f3-27f3-4d45-855d-6f2feacb5896
          level: CAN_MANAGE_RUN

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: refresh_streaming_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.shopsphere_data_platform_etl.id}

        - task_key: merge_current_orders
          depends_on:
            - task_key: refresh_streaming_pipeline

          python_wheel_task:
            package_name: shopsphere_data_platform
            entry_point: cdf-merge

          environment_key: default

        - task_key: validate_outputs
          depends_on:
            - task_key: merge_current_orders

          python_wheel_task:
            package_name: shopsphere_data_platform
            entry_point: validate-outputs

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
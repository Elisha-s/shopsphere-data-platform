resources:
  jobs:
    shopsphere_validation:
      name: shopsphere_validation
      timeout_seconds: 1800

      # Lets Azure Data Factory's managed identity start this job.
      permissions:
        - service_principal_name: ${var.adf_service_principal_id}
          level: CAN_MANAGE_RUN

      tasks:
        - task_key: validate_outputs
          python_wheel_task:
            package_name: shopsphere_data_platform
            entry_point: validate-outputs
            parameters: ["--catalog", "${var.catalog}"]

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

resources:
  jobs:
    shopsphere_validation:
      name: shopsphere_validation

      permissions:
        - service_principal_name: fb2921f3-27f3-4d45-855d-6f2feacb5896
          level: CAN_MANAGE_RUN

      tasks:
        - task_key: validate_outputs
          python_wheel_task:
            package_name: shopsphere_data_platform
            entry_point: validate-outputs

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
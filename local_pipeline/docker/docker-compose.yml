# ShopSphere on a laptop: Kafka + event producer + the Spark/Delta pipeline.
#
#   docker compose -f local_pipeline/docker/docker-compose.yml up --build
#
# Kafka UI:            http://localhost:8080
# Pipeline output:     docker compose -f local_pipeline/docker/docker-compose.yml logs -f pipeline
# Tables and files:    the "shopsphere-data" volume, mounted at /app/data

name: shopsphere

x-shopsphere-image: &shopsphere-image
  image: shopsphere
  build:
    context: ../..
    dockerfile: local_pipeline/docker/Dockerfile
  networks:
    - shopsphere-network

services:

  # Single-node Kafka (KRaft mode, no ZooKeeper).
  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "9094:9094"   # for clients on your machine (localhost:9094)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped
    networks:
      - shopsphere-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: shopsphere
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    restart: unless-stopped
    networks:
      - shopsphere-network

  # Generates order events continuously, five per second.
  producer:
    <<: *shopsphere-image
    command: python -m ingestion.run_producer --target kafka --bootstrap-servers kafka:9092 --rate 5
    depends_on:
      - kafka
    restart: unless-stopped

  # Runs Bronze -> Silver -> CDF merge -> Gold -> Validation every 30 seconds.
  pipeline:
    <<: *shopsphere-image
    command: python -m local_pipeline.run_pipeline --source kafka --bootstrap-servers kafka:9092 --loop 30
    depends_on:
      - kafka
    volumes:
      - shopsphere-data:/app/data
    restart: unless-stopped

volumes:
  kafka-data:
  shopsphere-data:

networks:
  shopsphere-network:
